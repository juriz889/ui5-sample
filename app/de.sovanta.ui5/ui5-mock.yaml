# Serves the app with mocked OData services instead of the CAP backend, e.g. for OPA tests.
# Regenerate metadata and data in webapp/localService when the CDS model changes.
specVersion: "4.0"
metadata:
  name: de.sovanta.ui5
type: application
framework:
  name: SAPUI5
  version: "1.153.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
      configuration:
        excludePatterns:
          - "resources/"
          - "test/"
          - "localService/"
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /odata/v4/catalog
            metadataPath: ./webapp/localService/catalog/metadata.xml
            mockdataPath: ./webapp/localService/catalog/data
            generateMockData: false
          - urlPath: /odata/v4/admin
            metadataPath: ./webapp/localService/admin/metadata.xml
            mockdataPath: ./webapp/localService/admin/data
            generateMockData: false
